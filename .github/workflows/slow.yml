name: Slow tests (expert-depth coverage)

# 与 `ci.yml` 的主门禁拆开：这里跑"墙钟级"用例 ——
#   · `test_expert_level.py` 里 14 条专家档深度用例（每条 10–30s，要真的跑完 d3）；
#   · `test_performance.py` 的性能护栏。
# `continue-on-error: true`：35s 级用例在 CI 机器上更慢、更易抖动，
# 设成必绿迟早会有人把它注释掉 —— 这里要"可查、可手动触发、失败不阻塞合并"。
on:
  workflow_dispatch:
  schedule:
    - cron: "0 18 * * *"   # 每日 18:00 UTC（北京时间次日 02:00）

defaults:
  run:
    working-directory: xionghan-chess-next

jobs:
  slow:
    # 单平台即可：验的是"深度能不能跑完"，不是平台差异（平台差异由 ci.yml 的双 OS 矩阵覆盖）。
    runs-on: ubuntu-latest
    # 14 × 35s 上限约 8min，留足余量防慢机拖死整个 job。
    timeout-minutes: 30
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # 桌面测试在模块顶层 `pytest.importorskip("PySide6")`，没装就自动跳过，
      # 所以这里只装 test extra 即可（与 ci.yml 的 test job 同口径）。
      - run: pip install -e ".[test]"

      - run: pytest tests/ -m slow -q

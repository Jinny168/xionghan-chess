[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "xionghan-chess"
version = "1.6.0"
description = "Shared-core Xionghan Chess desktop, web and server implementation"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.116,<1",
  "uvicorn[standard]>=0.35,<1",
  "pydantic>=2.11,<3",
]

[project.optional-dependencies]
desktop = ["PySide6>=6.8,<7"]
build = ["pyinstaller>=6.14,<7", "pillow>=11,<13"]
test = ["pytest>=8.3,<9", "httpx>=0.28,<1"]
train = ["numpy>=2.1,<3"]

[project.scripts]
xionghan-server = "xionghan_chess.service.app:run"
xionghan-desktop = "xionghan_chess.desktop.app:run"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"xionghan_chess.desktop" = ["resources/icon.ico", "resources/fonts/*", "resources/sounds/*", "resources/backgrounds/*", "resources/avatars/*", "resources/docs/*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

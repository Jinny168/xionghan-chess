name: CI

# 两种门禁：
#   · **主 job（fast）**：push / PR 都跑，命令固定为 `-m "not slow"`。
#   · **slow job**：只由「手动触发」或「每日定时」触发，**不阻塞合并**
#     （`continue-on-error: true`）。35s 级用例在 CI 机器上更慢、更易抖动，
#     设成必绿迟早会有人把它注释掉。
on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 18 * * *"      # 每日 18:00 UTC（北京时间次日 02:00）

jobs:
  fast:
    name: 主门禁（pytest -m "not slow"）
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # PySide6 在无显示环境下需要这几个运行库；桌面测试统一走 offscreen。
      - name: 安装 Qt 运行库
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[desktop,test,train]"

      - name: pytest（默认门禁）
        run: python -m pytest tests/ -m "not slow" -q

  slow:
    name: 全量 slow（不阻塞）
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    continue-on-error: true
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: 安装 Qt 运行库
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[desktop,test,train]"

      - name: pytest（slow：专家档 14 条 + 性能护栏）
        run: python -m pytest tests/ -m slow -q

<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="data:;base64,=">
    <title>匈汉象棋 - 主页</title>
    <link rel="stylesheet" href="css/index.css?v=8">
</head>
<body>
    <!-- 背景 -->
    <div class="bg-decoration" id="bg-decoration"></div>
    
    <!-- 主容器 -->
    <div class="home-container">
        <!-- 标题区域 -->
        <div class="title-area">
            <div class="logo-wrapper">
                <img src="images/logo/icon.ico" alt="匈汉象棋" class="main-logo">
            </div>
            <h1 class="game-title">匈汉象棋</h1>
            <p class="subtitle">传承经典 · 创新对弈</p>
        </div>

        <!-- 模式选择卡片 -->
        <div class="mode-cards">
            <!-- 单机模式 -->
            <div class="mode-card local-mode">
                <div class="card-icon">👥</div>
                <h2 class="card-title">单机双人对战</h2>
                <p class="card-desc">
                    在同一台设备上进行双人对弈<br>
                    适合面对面切磋棋艺<br>
                    无需网络连接
                </p>
                <button class="card-btn primary" onclick="startLocalGame(event)">
                    开始游戏
                </button>
            </div>

            <!-- 联机模式 -->
            <div class="mode-card online-mode">
                <div class="card-icon">🌐</div>
                <h2 class="card-title">联机双人对战</h2>
                <p class="card-desc">
                    通过网络与好友远程对弈<br>
                    输入房间号即可加入游戏<br>
                    支持实时聊天互动
                </p>
                <button class="card-btn primary" onclick="showRoomInput(event)">
                    加入房间
                </button>
                <button class="card-btn secondary" onclick="createRoom(event)">
                    创建房间
                </button>
                
                <!-- 房间号输入 -->
                <div class="room-input-box" id="room-input-section">
                    <div class="input-group">
                        <input 
                            type="text" 
                            class="room-input" 
                            id="room-id-input" 
                            placeholder="输入房间号"
                            maxlength="8"
                        >
                        <button class="join-btn" onclick="joinRoom()">加入</button>
                    </div>
                    <div class="error-msg" id="error-message"></div>
                </div>
            </div>
        </div>

        <!-- 背景切换器 -->
        <div class="bg-switcher" id="bg-switcher">
            <button class="switch-btn" id="bg-prev" title="上一张">◀</button>
            <span class="bg-indicator" id="bg-indicator">1 / 5</span>
            <button class="switch-btn" id="bg-next" title="下一张">▶</button>
        </div>

        <!-- 版权信息 -->
        <div class="copyright">© 2026 靳中原</div>
    </div>

    <script>
        // 背景图片管理
        const backgrounds = [
            'images/backgrounds/1.jpg',
            'images/backgrounds/2.jpg',
            'images/backgrounds/3.jpg',
            'images/backgrounds/4.jpg',
            'images/backgrounds/5.jpg'
        ];
        let currentBgIndex = parseInt(localStorage.getItem('bgIndex')) || 0;
        
        function setBackground(index) {
            if (index < 0) index = backgrounds.length - 1;
            if (index >= backgrounds.length) index = 0;
            
            currentBgIndex = index;
            const bgElement = document.getElementById('bg-decoration');
            const indicator = document.getElementById('bg-indicator');
            
            bgElement.style.backgroundImage = `url('${backgrounds[index]}')`;
            bgElement.style.backgroundSize = 'cover';
            bgElement.style.backgroundPosition = 'center';
            bgElement.style.opacity = '0.4';
            
            indicator.textContent = `${index + 1} / ${backgrounds.length}`;
            
            localStorage.setItem('bgIndex', index);
        }
        
        function prevBackground() {
            setBackground(currentBgIndex - 1);
        }
        
        function nextBackground() {
            setBackground(currentBgIndex + 1);
        }
        
        function selectMode(mode) {
            console.log('选择模式:', mode);
        }

        function startLocalGame(event) {
            event.stopPropagation();
            
            const overlay = document.createElement('div');
            overlay.style.cssText = `
                position: fixed;
                top: 0; left: 0;
                width: 100%; height: 100%;
                background: rgba(0,0,0,0.7);
                display: flex;
                align-items: center;
                justify-content: center;
                z-index: 9999;
            `;
            
            const spinner = document.createElement('div');
            spinner.style.cssText = `
                width: 50px;
                height: 50px;
                border: 4px solid rgba(255,255,255,0.3);
                border-top-color: #ffd700;
                border-radius: 50%;
                animation: spin 0.8s linear infinite;
            `;
            
            const style = document.createElement('style');
            style.textContent = '@keyframes spin { to { transform: rotate(360deg); } }';
            document.head.appendChild(style);
            
            overlay.appendChild(spinner);
            document.body.appendChild(overlay);
            
            setTimeout(() => {
                window.location.href = '/game.html?mode=local';
            }, 500);
        }

        function showRoomInput(event) {
            event.stopPropagation();
            const inputSection = document.getElementById('room-input-section');
            inputSection.classList.toggle('active');
            
            if (inputSection.classList.contains('active')) {
                setTimeout(() => {
                    document.getElementById('room-id-input').focus();
                }, 100);
            }
        }

        function createRoom(event) {
            event.stopPropagation();
                    
            // 显示加载提示
            showLoading('正在创建房间...');
                    
            fetch('/api/create_room', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ mode: 'xionghan' })
            })
            .then(response => response.json())
            .then(data => {
                hideLoading();
                if (data.success) {
                    const roomId = data.roomId;
                            
                    // 复制到剪贴板
                    copyToClipboard(roomId);
                            
                    // 显示成功信息
                    showRoomCreatedDialog(roomId);
                } else {
                    alert('❌ 创建房间失败: ' + (data.error || '未知错误'));
                }
            })
            .catch(error => {
                hideLoading();
                alert('❌ 网络错误: ' + error.message);
            });
        }
                
        /**
         * 复制到剪贴板
         */
        function copyToClipboard(text) {
            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(text).then(() => {
                    console.log('✅ 房间号已复制到剪贴板');
                }).catch(err => {
                    console.warn('⚠️ 复制失败:', err);
                });
            }
        }
                
        /**
         * 显示房间创建成功对话框
         */
        function showRoomCreatedDialog(roomId) {
            const overlay = document.createElement('div');
            overlay.style.cssText = `
                position: fixed;
                top: 0; left: 0;
                width: 100%; height: 100%;
                background: rgba(0,0,0,0.8);
                display: flex;
                align-items: center;
                justify-content: center;
                z-index: 10000;
            `;
                    
            const dialog = document.createElement('div');
            dialog.style.cssText = `
                background: white;
                padding: 30px;
                border-radius: 10px;
                text-align: center;
                max-width: 400px;
                box-shadow: 0 4px 20px rgba(0,0,0,0.3);
            `;
                    
            dialog.innerHTML = `
                <h2 style="color: #4CAF50; margin-bottom: 20px;">✅ 房间创建成功！</h2>
                <p style="font-size: 16px; margin-bottom: 15px;">房间号：</p>
                <div style="
                    font-size: 32px;
                    font-weight: bold;
                    color: #2196F3;
                    padding: 15px;
                    background: #f0f0f0;
                    border-radius: 5px;
                    margin: 15px 0;
                    letter-spacing: 3px;
                ">${roomId}</div>
                <p style="font-size: 14px; color: #666; margin-bottom: 20px;">
                    💡 房间号已自动复制到剪贴板<br>
                    请将此房间号分享给好友
                </p>
                <button onclick="this.closest('div').parentElement.remove()" style="
                    padding: 10px 30px;
                    background: #4CAF50;
                    color: white;
                    border: none;
                    border-radius: 5px;
                    cursor: pointer;
                    font-size: 16px;
                ">确定</button>
            `;
                    
            overlay.appendChild(dialog);
            document.body.appendChild(overlay);
                    
            // 点击背景关闭
            overlay.addEventListener('click', (e) => {
                if (e.target === overlay) {
                    overlay.remove();
                }
            });
        }

        function joinRoom() {
            const roomId = document.getElementById('room-id-input').value.trim().toUpperCase();
            const errorMsg = document.getElementById('error-message');
            
            if (!roomId) {
                errorMsg.textContent = '❌ 请输入房间号';
                errorMsg.classList.add('show');
                return;
            }
            
            if (roomId.length !== 8) {
                errorMsg.textContent = '❌ 房间号格式不正确（应为8位）';
                errorMsg.classList.add('show');
                return;
            }
            
            errorMsg.classList.remove('show');
            
            // 显示加载动画
            showLoading('正在加入房间...');
            
            // 检查房间是否存在
            fetch(`/api/room_status/${roomId}`)
                .then(response => response.json())
                .then(data => {
                    hideLoading();
                    if (data.success) {
                        if (data.players >= 2) {
                            errorMsg.textContent = '❌ 房间已满';
                            errorMsg.classList.add('show');
                        } else {
                            // 跳转到游戏页面
                            setTimeout(() => {
                                window.location.href = `/game.html?mode=online&room=${roomId}`;
                            }, 300);
                        }
                    } else {
                        errorMsg.textContent = '❌ 房间不存在';
                        errorMsg.classList.add('show');
                    }
                })
                .catch(error => {
                    hideLoading();
                    errorMsg.textContent = '❌ 网络错误: ' + error.message;
                    errorMsg.classList.add('show');
                });
        }
        
        /**
         * 显示加载动画
         */
        function showLoading(message) {
            const overlay = document.createElement('div');
            overlay.id = 'loading-overlay';
            overlay.style.cssText = `
                position: fixed;
                top: 0; left: 0;
                width: 100%; height: 100%;
                background: rgba(0,0,0,0.7);
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                z-index: 9999;
            `;
            
            const spinner = document.createElement('div');
            spinner.style.cssText = `
                width: 50px;
                height: 50px;
                border: 4px solid rgba(255,255,255,0.3);
                border-top-color: #ffd700;
                border-radius: 50%;
                animation: spin 0.8s linear infinite;
            `;
            
            const text = document.createElement('div');
            text.textContent = message || '加载中...';
            text.style.cssText = `
                color: white;
                margin-top: 20px;
                font-size: 16px;
            `;
            
            const style = document.createElement('style');
            style.textContent = '@keyframes spin { to { transform: rotate(360deg); } }';
            document.head.appendChild(style);
            
            overlay.appendChild(spinner);
            overlay.appendChild(text);
            document.body.appendChild(overlay);
        }
        
        /**
         * 隐藏加载动画
         */
        function hideLoading() {
            const overlay = document.getElementById('loading-overlay');
            if (overlay) {
                overlay.remove();
            }
        }

        window.addEventListener('load', () => {
            setBackground(currentBgIndex);
        });
        
        document.getElementById('bg-prev').addEventListener('click', prevBackground);
        document.getElementById('bg-next').addEventListener('click', nextBackground);
    </script>
</body>
</html>

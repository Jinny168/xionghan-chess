<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="data:;base64,=">
    <title>匈汉象棋 - 主页</title>
    <!-- 外部样式表 -->
    <link rel="stylesheet" href="css/index.css?v=1">
</head>
<body>
    <!-- 背景装饰 -->
    <div class="bg-decoration"></div>

    <!-- 加载动画 -->
    <div class="loading-overlay" id="loading-overlay">
        <div class="loading-spinner"></div>
    </div>

    <!-- 主容器 -->
    <div class="main-container">
        <!-- 标题区域 -->
        <div class="title-section">
            <h1 class="game-title">匈汉象棋</h1>
            <p class="subtitle">传承经典 · 创新对弈</p>
        </div>

        <!-- 模式选择 -->
        <div class="mode-selection">
            <!-- 单机双人对战 -->
            <div class="mode-card" onclick="selectMode('local')">
                <div class="mode-icon">👥</div>
                <h2 class="mode-title">单机双人对战</h2>
                <p class="mode-description">
                    在同一台设备上进行双人对弈<br>
                    适合面对面切磋棋艺<br>
                    无需网络连接
                </p>
                <button class="mode-button" onclick="startLocalGame(event)">
                    开始游戏
                </button>
            </div>

            <!-- 联机双人对战 -->
            <div class="mode-card" onclick="selectMode('online')">
                <div class="mode-icon">🌐</div>
                <h2 class="mode-title">联机双人对战</h2>
                <p class="mode-description">
                    通过网络与好友远程对弈<br>
                    输入房间号即可加入游戏<br>
                    支持实时聊天互动
                </p>
                <button class="mode-button" onclick="showRoomInput(event)">
                    加入房间
                </button>
                <button class="mode-button" style="margin-top: 0.5rem; background: linear-gradient(135deg, #FF9800 0%, #F57C00 100%);" onclick="createRoom(event)">
                    创建房间
                </button>
                
                <!-- 房间号输入区域 -->
                <div class="room-input-section" id="room-input-section">
                    <div class="room-input-group">
                        <input 
                            type="text" 
                            class="room-input" 
                            id="room-id-input" 
                            placeholder="输入房间号"
                            maxlength="8"
                        >
                        <button class="join-button" onclick="joinRoom()">
                            加入
                        </button>
                    </div>
                    <div class="error-message" id="error-message"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- 版权信息 -->
    <div class="copyright">© 2026 靳中原</div>

    <script>
        /**
         * 选择模式（卡片点击效果）
         */
        function selectMode(mode) {
            // 可以在这里添加卡片选中效果
            console.log('选择模式:', mode);
        }

        /**
         * 开始单机游戏
         */
        function startLocalGame(event) {
            event.stopPropagation();
            
            showLoading();
            
            // 延迟跳转，显示加载动画
            setTimeout(() => {
                window.location.href = '/game.html?mode=local';
            }, 500);
        }

        /**
         * 显示房间号输入框
         */
        function showRoomInput(event) {
            event.stopPropagation();
            
            const inputSection = document.getElementById('room-input-section');
            inputSection.classList.toggle('active');
            
            if (inputSection.classList.contains('active')) {
                // 聚焦到输入框
                setTimeout(() => {
                    document.getElementById('room-id-input').focus();
                }, 100);
            }
        }

        /**
         * 创建房间
         */
        function createRoom(event) {
            event.stopPropagation();
            
            showLoading();
            
            // 调用API创建房间
            fetch('/api/create_room', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ mode: 'xionghan' })
            })
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    hideLoading();
                    // 显示房间号并提示用户
                    const roomId = data.roomId;
                    window.dialogManager.showInfo(
                        '房间创建成功',
                        `房间号: ${roomId}\n\n请将此房间号分享给好友，然后点击“加入房间”按钮输入房间号即可开始游戏。`,
                        () => {
                            // 自动填充房间号
                            const inputSection = document.getElementById('room-input-section');
                            const input = document.getElementById('room-id-input');
                            input.value = roomId;
                            if (!inputSection.classList.contains('active')) {
                                inputSection.classList.add('active');
                            }
                            input.focus();
                            input.select();
                        }
                    );
                } else {
                    hideLoading();
                    showError('创建房间失败: ' + (data.error || '未知错误'));
                }
            })
            .catch(error => {
                hideLoading();
                showError('连接服务器失败，请检查网络');
                console.error('创建房间失败:', error);
            });
        }

        /**
         * 加入房间
         */
        function joinRoom() {
            const roomIdInput = document.getElementById('room-id-input');
            const roomId = roomIdInput.value.trim();
            const errorMessage = document.getElementById('error-message');
            
            // 验证房间号
            if (!roomId) {
                showError('请输入房间号');
                return;
            }
            
            if (roomId.length !== 8) {
                showError('房间号必须为8位字符');
                return;
            }
            
            // 隐藏错误信息
            errorMessage.classList.remove('active');
            
            // 显示加载动画
            showLoading();
            
            // 验证房间是否存在
            verifyRoom(roomId)
                .then(exists => {
                    if (exists) {
                        // 房间存在，跳转到游戏页面
                        window.location.href = `/game.html?mode=online&roomId=${roomId}`;
                    } else {
                        hideLoading();
                        showError('房间不存在或已满');
                    }
                })
                .catch(error => {
                    hideLoading();
                    showError('连接服务器失败，请检查网络');
                    console.error('验证房间失败:', error);
                });
        }

        /**
         * 验证房间是否存在
         */
        async function verifyRoom(roomId) {
            try {
                const response = await fetch(`/api/room_status/${roomId}`);
                const data = await response.json();
                
                if (data.success && data.players < 2) {
                    return true;
                }
                return false;
            } catch (error) {
                console.error('验证房间失败:', error);
                throw error;
            }
        }

        /**
         * 显示错误信息
         */
        function showError(message) {
            const errorMessage = document.getElementById('error-message');
            errorMessage.textContent = message;
            errorMessage.classList.add('active');
            
            // 3秒后自动隐藏
            setTimeout(() => {
                errorMessage.classList.remove('active');
            }, 3000);
        }

        /**
         * 显示加载动画
         */
        function showLoading() {
            document.getElementById('loading-overlay').classList.add('active');
        }

        /**
         * 隐藏加载动画
         */
        function hideLoading() {
            document.getElementById('loading-overlay').classList.remove('active');
        }

        /**
         * 监听回车键
         */
        document.getElementById('room-id-input').addEventListener('keypress', function(event) {
            if (event.key === 'Enter') {
                joinRoom();
            }
        });

        // 页面加载完成后的初始化
        window.addEventListener('load', () => {
            console.log('匈汉象棋主页加载完成');
        });
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>控制器集成测试 - 浏览器版</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Microsoft YaHei', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 10px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }

        .header h1 {
            font-size: 2em;
            margin-bottom: 10px;
        }

        .header p {
            opacity: 0.9;
            font-size: 1.1em;
        }

        .controls {
            padding: 20px 30px;
            background: #f8f9fa;
            border-bottom: 2px solid #e9ecef;
            display: flex;
            gap: 15px;
            align-items: center;
        }

        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.3s;
            font-weight: bold;
        }

        .btn-primary {
            background: #667eea;
            color: white;
        }

        .btn-primary:hover {
            background: #5568d3;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
        }

        .btn-secondary {
            background: #6c757d;
            color: white;
        }

        .btn-secondary:hover {
            background: #5a6268;
        }

        .status-bar {
            padding: 15px 30px;
            background: #fff;
            border-bottom: 2px solid #e9ecef;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
        }

        .status-item {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 16px;
        }

        .status-icon {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
        }

        .status-pass .status-icon {
            background: #28a745;
            color: white;
        }

        .status-fail .status-icon {
            background: #dc3545;
            color: white;
        }

        .content {
            padding: 30px;
            max-height: 600px;
            overflow-y: auto;
        }

        .test-result {
            padding: 10px 15px;
            margin-bottom: 8px;
            border-radius: 6px;
            display: flex;
            align-items: center;
            gap: 10px;
            transition: all 0.2s;
        }

        .test-result.pass {
            background: #d4edda;
            border-left: 4px solid #28a745;
        }

        .test-result.fail {
            background: #f8d7da;
            border-left: 4px solid #dc3545;
        }

        .summary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            border-radius: 8px;
            margin-top: 30px;
        }

        .summary-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
        }

        .summary-item {
            background: rgba(255, 255, 255, 0.1);
            padding: 20px;
            border-radius: 8px;
            text-align: center;
        }

        .summary-value {
            font-size: 2.5em;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .console-output {
            margin-top: 30px;
            background: #1e1e1e;
            color: #d4d4d4;
            padding: 20px;
            border-radius: 8px;
            font-family: 'Consolas', 'Monaco', monospace;
            font-size: 14px;
            max-height: 400px;
            overflow-y: auto;
        }

        .console-output pre {
            margin: 0;
            white-space: pre-wrap;
            word-wrap: break-word;
        }

        .info-box {
            background: #e7f3ff;
            border-left: 4px solid #2196F3;
            padding: 15px;
            margin: 20px 30px;
            border-radius: 4px;
        }

        .info-box h3 {
            color: #1976D2;
            margin-bottom: 8px;
        }

        .info-box ul {
            list-style-position: inside;
            line-height: 1.8;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🧪 控制器架构集成测试</h1>
            <p>验证重构后的模块化控制器是否正常工作（浏览器版本，无需Node.js）</p>
        </div>

        <div class="info-box">
            <h3>📋 测试说明</h3>
            <ul>
                <li>本测试在浏览器中直接运行，无需安装Node.js</li>
                <li>点击"运行测试"按钮开始自动测试所有控制器功能</li>
                <li>测试结果将实时显示在下方</li>
                <li>绿色表示通过，红色表示失败</li>
            </ul>
        </div>

        <div class="controls">
            <button class="btn btn-primary" onclick="runTests()">▶️ 运行测试</button>
            <button class="btn btn-secondary" onclick="clearResults()">🗑️ 清除结果</button>
            <div style="flex: 1;"></div>
            <span id="test-status" style="font-weight: bold; color: #667eea;">准备就绪</span>
        </div>

        <div class="status-bar">
            <div class="status-item">
                <div class="status-icon" style="background: #667eea;">📊</div>
                <span>总测试: <strong id="total-count">0</strong></span>
            </div>
            <div class="status-item status-pass">
                <div class="status-icon">✓</div>
                <span>通过: <strong id="pass-count">0</strong></span>
            </div>
            <div class="status-item status-fail">
                <div class="status-icon">✗</div>
                <span>失败: <strong id="fail-count">0</strong></span>
            </div>
            <div class="status-item">
                <div class="status-icon" style="background: #ffc107;">📈</div>
                <span>通过率: <strong id="pass-rate">0%</strong></span>
            </div>
        </div>

        <div class="content" id="test-results">
            <div style="text-align: center; padding: 60px 20px; color: #6c757d;">
                <div style="font-size: 4em; margin-bottom: 20px;">🧪</div>
                <h2>点击"运行测试"开始验证</h2>
                <p>将测试所有控制器的功能和协作能力</p>
            </div>
        </div>

        <div class="console-output" id="console-output" style="display: none;">
            <h3 style="color: #4CAF50; margin-bottom: 10px;">📝 控制台输出</h3>
            <pre id="console-text"></pre>
        </div>
    </div>

    <!-- 加载游戏核心模块 -->
    <script src="../js/core/chess-piece.js?v=1"></script>
    <script src="../js/core/game-rules.js?v=1"></script>
    <script src="../js/core/game-state.js?v=1"></script>
    
    <!-- 加载UI模块 -->
    <script src="../js/ui/chess-board-renderer.js?v=1"></script>
    <script src="../js/ui/dialog-manager.js?v=1"></script>
    
    <!-- 加载控制器模块 -->
    <script src="../js/controllers/event-dispatcher.js?v=1"></script>
    <script src="../js/controllers/sound-manager.js?v=1"></script>
    <script src="../js/controllers/avatar-manager.js?v=1"></script>
    <script src="../js/controllers/taunt-manager.js?v=1"></script>
    <script src="../js/controllers/statistics-manager.js?v=1"></script>
    <script src="../js/controllers/game-rule-config.js?v=1"></script>
    <script src="../js/controllers/game-logic-handler.js?v=1"></script>
    <script src="../js/controllers/network-handler.js?v=1"></script>
    <script src="../js/controllers/ui-controller.js?v=1"></script>
    <script src="../js/controllers/game-record-manager.js?v=1"></script>
    <script src="../js/controllers/replay-controller.js?v=1"></script>
    <script src="../js/controllers/replay-manager.js?v=1"></script>
    <script src="../js/controllers/game-controller.js?v=1"></script>
    
    <!-- 加载测试脚本 -->
    <script src="test-controllers-browser.js?v=1"></script>

    <script>
        let testRunner = null;
        let consoleBuffer = [];

        // 拦截console输出
        function interceptConsole() {
            const originalLog = console.log;
            const originalError = console.error;

            console.log = function(...args) {
                const message = args.map(arg => 
                    typeof arg === 'object' ? JSON.stringify(arg, null, 2) : String(arg)
                ).join(' ');
                consoleBuffer.push(`[LOG] ${message}`);
                updateConsoleOutput();
                originalLog.apply(console, args);
            };

            console.error = function(...args) {
                const message = args.map(arg => 
                    typeof arg === 'object' ? JSON.stringify(arg, null, 2) : String(arg)
                ).join(' ');
                consoleBuffer.push(`[ERROR] ${message}`);
                updateConsoleOutput();
                originalError.apply(console, args);
            };
        }

        function updateConsoleOutput() {
            const consoleElement = document.getElementById('console-output');
            const consoleText = document.getElementById('console-text');
            
            if (consoleBuffer.length > 0) {
                consoleElement.style.display = 'block';
                consoleText.textContent = consoleBuffer.join('\n');
                consoleElement.scrollTop = consoleElement.scrollHeight;
            }
        }

        async function runTests() {
            // 重置状态
            consoleBuffer = [];
            interceptConsole();
            
            document.getElementById('test-status').textContent = '⏳ 运行中...';
            document.getElementById('test-results').innerHTML = 
                '<div style="text-align: center; padding: 60px;">' +
                '<div style="font-size: 3em; animation: spin 1s linear infinite;">⏳</div>' +
                '<p>正在运行测试...</p></div>';
            
            // 创建测试实例
            testRunner = new window.ControllerIntegrationTest();
            
            // 运行测试
            const results = await testRunner.runAllTests();
            
            // 更新状态栏
            document.getElementById('total-count').textContent = results.total;
            document.getElementById('pass-count').textContent = results.passed;
            document.getElementById('fail-count').textContent = results.failed;
            document.getElementById('pass-rate').textContent = results.rate + '%';
            
            // 显示详细结果
            showDetailedResults(results);
            
            document.getElementById('test-status').textContent = '✅ 测试完成';
        }

        function showDetailedResults(results) {
            const resultsDiv = document.getElementById('test-results');
            resultsDiv.innerHTML = '';

            // 添加每个测试的结果
            testRunner.testResults.forEach((result, index) => {
                const resultItem = document.createElement('div');
                resultItem.className = `test-result ${result.status}`;
                
                const icon = result.status === 'pass' ? '✅' : '❌';
                resultItem.innerHTML = `
                    <span style="font-size: 1.2em;">${icon}</span>
                    <span><strong>测试 ${index + 1}:</strong> ${result.message}</span>
                `;
                
                if (result.error) {
                    resultItem.innerHTML += `
                        <div style="margin-top: 5px; padding: 8px; background: rgba(220, 53, 69, 0.1); border-radius: 4px; font-size: 0.9em; color: #721c24;">
                            <strong>错误:</strong> ${result.error}
                        </div>
                    `;
                }
                
                resultsDiv.appendChild(resultItem);
            });

            // 添加总结
            const summaryDiv = document.createElement('div');
            summaryDiv.className = 'summary';
            
            const isSuccess = results.failed === 0;
            summaryDiv.innerHTML = `
                <h2>${isSuccess ? '🎉 所有测试通过！' : '⚠️ 部分测试失败'}</h2>
                <div class="summary-grid">
                    <div class="summary-item">
                        <div class="summary-value">${results.total}</div>
                        <div class="summary-label">总测试数</div>
                    </div>
                    <div class="summary-item">
                        <div class="summary-value" style="color: #28a745;">${results.passed}</div>
                        <div class="summary-label">通过</div>
                    </div>
                    <div class="summary-item">
                        <div class="summary-value" style="color: #dc3545;">${results.failed}</div>
                        <div class="summary-label">失败</div>
                    </div>
                    <div class="summary-item">
                        <div class="summary-value">${results.rate}%</div>
                        <div class="summary-label">通过率</div>
                    </div>
                </div>
            `;
            
            resultsDiv.appendChild(summaryDiv);
        }

        function clearResults() {
            document.getElementById('test-results').innerHTML = `
                <div style="text-align: center; padding: 60px 20px; color: #6c757d;">
                    <div style="font-size: 4em; margin-bottom: 20px;">🧪</div>
                    <h2>点击"运行测试"开始验证</h2>
                    <p>将测试所有控制器的功能和协作能力</p>
                </div>
            `;
            
            document.getElementById('console-output').style.display = 'none';
            consoleBuffer = [];
            
            document.getElementById('total-count').textContent = '0';
            document.getElementById('pass-count').textContent = '0';
            document.getElementById('fail-count').textContent = '0';
            document.getElementById('pass-rate').textContent = '0%';
            
            document.getElementById('test-status').textContent = '准备就绪';
        }

        // 添加旋转动画
        const style = document.createElement('style');
        style.textContent = `
            @keyframes spin {
                from { transform: rotate(0deg); }
                to { transform: rotate(360deg); }
            }
        `;
        document.head.appendChild(style);
    </script>
</body>
</html>

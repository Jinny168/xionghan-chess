<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>控制器架构集成测试</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Microsoft YaHei', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 10px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }

        .header h1 {
            font-size: 2em;
            margin-bottom: 10px;
        }

        .header p {
            opacity: 0.9;
            font-size: 1.1em;
        }

        .controls {
            padding: 20px 30px;
            background: #f8f9fa;
            border-bottom: 2px solid #e9ecef;
            display: flex;
            gap: 15px;
            align-items: center;
        }

        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.3s;
            font-weight: bold;
        }

        .btn-primary {
            background: #667eea;
            color: white;
        }

        .btn-primary:hover {
            background: #5568d3;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
        }

        .btn-secondary {
            background: #6c757d;
            color: white;
        }

        .btn-secondary:hover {
            background: #5a6268;
        }

        .status-bar {
            padding: 15px 30px;
            background: #fff;
            border-bottom: 2px solid #e9ecef;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .status-item {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 16px;
        }

        .status-icon {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
        }

        .status-pass .status-icon {
            background: #28a745;
            color: white;
        }

        .status-fail .status-icon {
            background: #dc3545;
            color: white;
        }

        .status-running .status-icon {
            background: #ffc107;
            color: white;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .content {
            padding: 30px;
            max-height: 600px;
            overflow-y: auto;
        }

        .test-section {
            margin-bottom: 30px;
            border: 2px solid #e9ecef;
            border-radius: 8px;
            overflow: hidden;
        }

        .test-section-header {
            background: #f8f9fa;
            padding: 15px 20px;
            font-weight: bold;
            font-size: 1.1em;
            border-bottom: 2px solid #e9ecef;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .test-section-body {
            padding: 20px;
        }

        .test-item {
            padding: 10px 15px;
            margin-bottom: 8px;
            border-radius: 6px;
            display: flex;
            align-items: center;
            gap: 10px;
            transition: all 0.2s;
        }

        .test-item:hover {
            background: #f8f9fa;
        }

        .test-item.pass {
            background: #d4edda;
            border-left: 4px solid #28a745;
        }

        .test-item.fail {
            background: #f8d7da;
            border-left: 4px solid #dc3545;
        }

        .test-item.pending {
            background: #fff3cd;
            border-left: 4px solid #ffc107;
        }

        .test-icon {
            font-size: 1.2em;
        }

        .summary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            border-radius: 8px;
            margin-top: 30px;
        }

        .summary h2 {
            margin-bottom: 20px;
            font-size: 1.5em;
        }

        .summary-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
        }

        .summary-item {
            background: rgba(255, 255, 255, 0.1);
            padding: 20px;
            border-radius: 8px;
            text-align: center;
        }

        .summary-value {
            font-size: 2.5em;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .summary-label {
            font-size: 0.9em;
            opacity: 0.9;
        }

        .error-details {
            margin-top: 10px;
            padding: 10px;
            background: rgba(220, 53, 69, 0.1);
            border-radius: 4px;
            font-size: 0.9em;
            color: #721c24;
        }

        .console-output {
            margin-top: 30px;
            background: #1e1e1e;
            color: #d4d4d4;
            padding: 20px;
            border-radius: 8px;
            font-family: 'Consolas', 'Monaco', monospace;
            font-size: 14px;
            max-height: 400px;
            overflow-y: auto;
        }

        .console-output pre {
            margin: 0;
            white-space: pre-wrap;
            word-wrap: break-word;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🧪 控制器架构集成测试</h1>
            <p>验证重构后的模块化控制器是否正常工作</p>
        </div>

        <div class="controls">
            <button class="btn btn-primary" onclick="runTests()">▶️ 运行测试</button>
            <button class="btn btn-secondary" onclick="clearResults()">🗑️ 清除结果</button>
            <div style="flex: 1;"></div>
            <span id="test-status">准备就绪</span>
        </div>

        <div class="status-bar">
            <div class="status-item" id="status-total">
                <div class="status-icon">📊</div>
                <span>总测试: 0</span>
            </div>
            <div class="status-item status-pass" id="status-pass">
                <div class="status-icon">✓</div>
                <span>通过: 0</span>
            </div>
            <div class="status-item status-fail" id="status-fail">
                <div class="status-icon">✗</div>
                <span>失败: 0</span>
            </div>
            <div class="status-item" id="status-rate">
                <div class="status-icon">📈</div>
                <span>通过率: 0%</span>
            </div>
        </div>

        <div class="content" id="test-results">
            <div style="text-align: center; padding: 60px 20px; color: #6c757d;">
                <div style="font-size: 4em; margin-bottom: 20px;">🧪</div>
                <h2>点击"运行测试"开始验证</h2>
                <p>将测试所有控制器的功能和协作能力</p>
            </div>
        </div>

        <div class="console-output" id="console-output" style="display: none;">
            <pre id="console-text"></pre>
        </div>
    </div>

    <!-- 加载依赖 -->
    <script src="../js/core/game-state.js"></script>
    <script src="../js/controllers/event-dispatcher.js"></script>
    <script src="../js/controllers/game-logic-handler.js"></script>
    <script src="../js/controllers/network-handler.js"></script>
    <script src="../js/controllers/ui-controller.js"></script>
    <script src="../js/controllers/game-record-manager.js"></script>
    <script src="../js/controllers/replay-controller.js"></script>
    <script src="../js/controllers/replay-manager.js"></script>
    <script src="../js/controllers/game-controller.js"></script>
    <script src="test-controllers-integration.js"></script>

    <script>
        let testRunner = null;
        let consoleBuffer = [];

        // 拦截console输出
        const originalConsole = {
            log: console.log,
            error: console.error,
            warn: console.warn
        };

        function interceptConsole() {
            console.log = function(...args) {
                const message = args.map(arg => 
                    typeof arg === 'object' ? JSON.stringify(arg, null, 2) : String(arg)
                ).join(' ');
                consoleBuffer.push(`[LOG] ${message}`);
                updateConsoleOutput();
                originalConsole.log.apply(console, args);
            };

            console.error = function(...args) {
                const message = args.map(arg => 
                    typeof arg === 'object' ? JSON.stringify(arg, null, 2) : String(arg)
                ).join(' ');
                consoleBuffer.push(`[ERROR] ${message}`);
                updateConsoleOutput();
                originalConsole.error.apply(console, args);
            };
        }

        function updateConsoleOutput() {
            const consoleElement = document.getElementById('console-output');
            const consoleText = document.getElementById('console-text');
            
            if (consoleBuffer.length > 0) {
                consoleElement.style.display = 'block';
                consoleText.textContent = consoleBuffer.join('\n');
                consoleElement.scrollTop = consoleElement.scrollHeight;
            }
        }

        async function runTests() {
            // 重置状态
            consoleBuffer = [];
            interceptConsole();
            
            document.getElementById('test-status').textContent = '运行中...';
            document.getElementById('test-results').innerHTML = '<div style="text-align: center; padding: 60px;"><div style="font-size: 3em; animation: spin 1s linear infinite;">⏳</div><p>正在运行测试...</p></div>';
            
            // 创建测试实例
            testRunner = new ControllerIntegrationTest();
            
            // 重写方法以更新UI
            const originalPass = testRunner.pass.bind(testRunner);
            const originalFail = testRunner.fail.bind(testRunner);
            
            testRunner.pass = function(message) {
                originalPass(message);
                addTestResult('pass', message);
                updateStatusBar();
            };
            
            testRunner.fail = function(message, error) {
                originalFail(message, error);
                addTestResult('fail', message, error.message);
                updateStatusBar();
            };
            
            // 运行测试
            await testRunner.runAllTests();
            
            // 显示总结
            showSummary();
            
            document.getElementById('test-status').textContent = '测试完成';
        }

        function addTestResult(status, message, error = null) {
            const resultsDiv = document.getElementById('test-results');
            
            // 如果是第一个结果，清空初始内容
            if (resultsDiv.querySelector('[style*="text-align: center"]')) {
                resultsDiv.innerHTML = '';
            }
            
            const testItem = document.createElement('div');
            testItem.className = `test-item ${status}`;
            
            const icon = status === 'pass' ? '✅' : '❌';
            testItem.innerHTML = `
                <span class="test-icon">${icon}</span>
                <span>${message}</span>
            `;
            
            if (error) {
                testItem.innerHTML += `
                    <div class="error-details">
                        <strong>错误:</strong> ${error}
                    </div>
                `;
            }
            
            resultsDiv.appendChild(testItem);
            resultsDiv.scrollTop = resultsDiv.scrollHeight;
        }

        function updateStatusBar() {
            document.getElementById('status-total').innerHTML = `
                <div class="status-icon">📊</div>
                <span>总测试: ${testRunner.totalTests}</span>
            `;
            
            document.getElementById('status-pass').innerHTML = `
                <div class="status-icon">✓</div>
                <span>通过: ${testRunner.passedTests}</span>
            `;
            
            document.getElementById('status-fail').innerHTML = `
                <div class="status-icon">✗</div>
                <span>失败: ${testRunner.failedTests}</span>
            `;
            
            const rate = testRunner.totalTests > 0 
                ? ((testRunner.passedTests / testRunner.totalTests) * 100).toFixed(2)
                : 0;
            
            document.getElementById('status-rate').innerHTML = `
                <div class="status-icon">📈</div>
                <span>通过率: ${rate}%</span>
            `;
        }

        function showSummary() {
            const resultsDiv = document.getElementById('test-results');
            
            const summaryDiv = document.createElement('div');
            summaryDiv.className = 'summary';
            
            const rate = ((testRunner.passedTests / testRunner.totalTests) * 100).toFixed(2);
            const isSuccess = testRunner.failedTests === 0;
            
            summaryDiv.innerHTML = `
                <h2>${isSuccess ? '🎉 所有测试通过！' : '⚠️ 部分测试失败'}</h2>
                <div class="summary-grid">
                    <div class="summary-item">
                        <div class="summary-value">${testRunner.totalTests}</div>
                        <div class="summary-label">总测试数</div>
                    </div>
                    <div class="summary-item">
                        <div class="summary-value" style="color: #28a745;">${testRunner.passedTests}</div>
                        <div class="summary-label">通过</div>
                    </div>
                    <div class="summary-item">
                        <div class="summary-value" style="color: #dc3545;">${testRunner.failedTests}</div>
                        <div class="summary-label">失败</div>
                    </div>
                    <div class="summary-item">
                        <div class="summary-value">${rate}%</div>
                        <div class="summary-label">通过率</div>
                    </div>
                </div>
            `;
            
            resultsDiv.appendChild(summaryDiv);
        }

        function clearResults() {
            document.getElementById('test-results').innerHTML = `
                <div style="text-align: center; padding: 60px 20px; color: #6c757d;">
                    <div style="font-size: 4em; margin-bottom: 20px;">🧪</div>
                    <h2>点击"运行测试"开始验证</h2>
                    <p>将测试所有控制器的功能和协作能力</p>
                </div>
            `;
            
            document.getElementById('console-output').style.display = 'none';
            consoleBuffer = [];
            
            document.getElementById('status-total').innerHTML = `
                <div class="status-icon">📊</div>
                <span>总测试: 0</span>
            `;
            
            document.getElementById('status-pass').innerHTML = `
                <div class="status-icon">✓</div>
                <span>通过: 0</span>
            `;
            
            document.getElementById('status-fail').innerHTML = `
                <div class="status-icon">✗</div>
                <span>失败: 0</span>
            `;
            
            document.getElementById('status-rate').innerHTML = `
                <div class="status-icon">📈</div>
                <span>通过率: 0%</span>
            `;
            
            document.getElementById('test-status').textContent = '准备就绪';
        }

        // 添加旋转动画
        const style = document.createElement('style');
        style.textContent = `
            @keyframes spin {
                from { transform: rotate(0deg); }
                to { transform: rotate(360deg); }
            }
        `;
        document.head.appendChild(style);
    </script>
</body>
</html>

# Redis 生产环境配置示例
# 适用于雄汉象棋在线对战平台
# 
# 使用方法：
# 1. 复制此文件到 C:\Program Files\Redis\redis.production.conf
# 2. 修改密码和内存限制
# 3. 重启 Redis 服务: redis-server.exe redis.production.conf

# ==================== 网络配置 ====================

# 绑定地址（生产环境建议仅绑定内网IP）
bind 127.0.0.1

# 端口
port 6379

# TCP 监听队列大小
tcp-backlog 511

# 超时时间（0 表示不超时）
timeout 0

# TCP keepalive
tcp-keepalive 300

# ==================== 安全配置 ====================

# 【必需】设置强密码认证
# 生成强密码建议：使用密码管理器生成 16+ 位随机字符串
requirepass XionghanChess2024!Secure@Redis

# 重命名危险命令（防止误操作或恶意攻击）
rename-command FLUSHDB ""
rename-command FLUSHALL ""
rename-command CONFIG ""
rename-command DEBUG ""

# ==================== 通用配置 ====================

# 以守护进程模式运行
daemonize no

# 日志级别（production 建议使用 notice 或 warning）
loglevel notice

# 日志文件路径
logfile "C:/Program Files/Redis/Logs/redis.log"

# 数据库数量
databases 16

# ==================== 持久化配置 - RDB 快照 ====================

# RDB 快照规则（满足任一条件即触发保存）
save 900 1      # 900秒(15分钟)内至少1个键变化
save 300 10     # 300秒(5分钟)内至少10个键变化
save 60 10000   # 60秒(1分钟)内至少10000个键变化

# RDB 压缩
rdbcompression yes

# RDB 校验和
rdbchecksum yes

# RDB 文件名
dbfilename dump.rdb

# RDB 文件目录
dir "C:/Program Files/Redis/Data/"

# ==================== 持久化配置 - AOF 日志 ====================

# 启用 AOF（追加只读文件）持久化
appendonly yes

# AOF 文件名
appendfilename "appendonly.aof"

# AOF 同步策略（推荐 everysec，性能和安全性平衡）
# always: 每次写入都同步（最安全，性能最差）
# everysec: 每秒同步一次（推荐）
# no: 由操作系统决定何时同步（最快，可能丢失数据）
appendfsync everysec

# AOF 重写期间是否禁用同步
no-appendfsync-on-rewrite no

# AOF 自动重写触发条件
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb

# ==================== 内存管理 ====================

# 最大内存限制（根据服务器配置调整）
# 建议设置为物理内存的 50-70%
maxmemory 2gb

# 内存淘汰策略（当达到 maxmemory 时）
# allkeys-lru: 从所有键中移除最近最少使用的键（推荐用于缓存）
# volatile-lru: 仅从设置了过期时间的键中移除 LRU 键
# allkeys-random: 随机移除键
# volatile-ttl: 移除即将过期的键
# noeviction: 不移除任何键，写操作返回错误（默认）
maxmemory-policy allkeys-lru

# LRU 采样数量
maxmemory-samples 5

# ==================== 惰性删除 ====================

# 惰性过期删除
lazyfree-lazy-eviction yes
lazyfree-lazy-expire yes
lazyfree-lazy-server-del yes

# ==================== 客户端配置 ====================

# 最大客户端连接数
maxclients 10000

# ==================== 慢查询日志 ====================

# 慢查询阈值（微秒，10000 = 10ms）
slowlog-log-slower-than 10000

# 慢查询日志最大长度
slowlog-max-len 128

# ==================== 高级配置 ====================

# Hash 优化配置
hash-max-ziplist-entries 512
hash-max-ziplist-value 64

# List 优化配置
list-max-ziplist-size -2
list-compress-depth 0

# Set 优化配置
set-max-intset-entries 512

# Sorted Set 优化配置
zset-max-ziplist-entries 128
zset-max-ziplist-value 64

# HyperLogLog 稀疏表示限制
hll-sparse-max-bytes 3000

# Stream 节点最大字节数
stream-node-max-bytes 4096
stream-node-max-entries 100

# ==================== 活动重新哈希 ====================

# 每 100ms 主动 rehash 的时间
activerehashing yes

# ==================== 输出缓冲限制 ====================

# 普通客户端
client-output-buffer-limit normal 0 0 0

# 复制客户端
client-output-buffer-limit replica 256mb 64mb 60

# Pub/Sub 客户端
client-output-buffer-limit pubsub 32mb 8mb 60

# ==================== Hz 配置 ====================

# Redis 后台任务执行频率（默认 10）
hz 10

# 动态 Hz
dynamic-hz yes

# ==================== AOF 重写优化 ====================

# AOF 重写期间是否启用增量 AOF
aof-use-rdb-preamble yes

# ==================== 集群配置（可选）====================

# 如果需要使用 Redis Cluster，取消以下注释
# cluster-enabled yes
# cluster-config-file nodes.conf
# cluster-node-timeout 5000

# ==================== 监控与告警建议 ====================

# 建议配合以下监控工具使用：
# 1. Redis Sentinel（哨兵模式）- 高可用
# 2. Redis Cluster - 分布式
# 3. Prometheus + Grafana - 可视化监控
# 4. ELK Stack - 日志分析

# 关键监控指标：
# - used_memory（内存使用）
# - connected_clients（客户端连接数）
# - instantaneous_ops_per_sec（每秒操作数）
# - keyspace_hits/misses（缓存命中率）
# - expired_keys（过期键数量）
# - evicted_keys（被淘汰的键数量）

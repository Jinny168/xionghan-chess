version: '3.8'

services:
  # Redis 服务
  redis:
    image: redis:7-alpine
    container_name: xionghan-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
      - ./web/server/redis.production.conf:/usr/local/etc/redis/redis.conf:ro
    command: redis-server /usr/local/etc/redis/redis.conf --requirepass ${REDIS_PASSWORD:-XionghanChess2024!Secure@Redis}
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-XionghanChess2024!Secure@Redis}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - xionghan-network

  # Flask 应用服务
  web:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: xionghan-web
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-XionghanChess2024!Secure@Redis}
      - FLASK_ENV=production
    volumes:
      - ../web:/app/web
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - xionghan-network

  # Nginx 反向代理（可选，用于生产环境）
  nginx:
    image: nginx:alpine
    container_name: xionghan-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - ../web:/usr/share/nginx/html:ro
    depends_on:
      - web
    networks:
      - xionghan-network
    profiles:
      - production

volumes:
  redis-data:
    driver: local

networks:
  xionghan-network:
    driver: bridge
